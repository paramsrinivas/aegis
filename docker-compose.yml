
name: aegis

services:

  vector-db:
    image: pgvector/pgvector:pg16
    profiles:
      - rag
    environment:
      POSTGRES_DB: aegis_rag
      POSTGRES_USER: aegis_rag
      POSTGRES_PASSWORD: ${AEGIS_VECTOR_DB_PASSWORD:-aegis_local_dev}
    volumes:
      - vector_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U aegis_rag -d aegis_rag
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - intelligence
    restart: unless-stopped

  manager:
    build: ./manager
    container_name: manager
    volumes:
      - ./manager/manager.py:/app/manager.py
      - ./requirements.txt:/app/requirements.txt
    working_dir: /app
    command: ["uvicorn", "manager:app", "--host", "0.0.0.0", "--port", "8001", "--loop", "asyncio", "--workers", "1"]
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/weights"]
      interval: 5s
      timeout: 2s
      retries: 3
    networks:
      - aegisnet

  router:
    build: .
    container_name: aegis_router
    volumes:
      - ./router.py:/app/router.py
      - ./router_poll_weights.py:/app/router_poll_weights.py
      - ./requirements.txt:/app/requirements.txt
    working_dir: /app
    command: ["python", "-m", "uvicorn", "router:app", "--host", "0.0.0.0", "--port", "8000", "--loop", "asyncio"]
    depends_on:
      - manager
      - backend1
      - backend2
      - backend3
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 5s
      timeout: 2s
      retries: 3
    networks:
      - aegisnet

  backend1:
    build: .
    container_name: backend1
    volumes:
      - ./backend.py:/app/backend.py
      - ./requirements.txt:/app/requirements.txt
    working_dir: /app
    environment:
      - BACKEND_NAME=backend1
      - PORT=8101
      - MEAN_MS=30
      - STD_MS=5
      - FAIL_RATE=0.0
    command: ["python", "backend.py"]
    ports:
      - "127.0.0.1:8101:8101"
    restart: unless-stopped
    networks:
      - aegisnet

  backend2:
    build: .
    container_name: backend2
    volumes:
      - ./backend.py:/app/backend.py
      - ./requirements.txt:/app/requirements.txt
    working_dir: /app
    environment:
      - BACKEND_NAME=backend2
      - PORT=8102
      - MEAN_MS=120
      - STD_MS=40
      - FAIL_RATE=0.05
    command: ["python", "backend.py"]
    ports:
      - "127.0.0.1:8102:8102"
    restart: unless-stopped
    networks:
      - aegisnet

  backend3:
    build: .
    container_name: backend3
    volumes:
      - ./backend.py:/app/backend.py
      - ./requirements.txt:/app/requirements.txt
    working_dir: /app
    environment:
      - BACKEND_NAME=backend3
      - PORT=8103
      - MEAN_MS=40
      - STD_MS=10
      - FAIL_RATE=0.0
    command: ["python", "backend.py"]
    ports:
      - "127.0.0.1:8103:8103"
    restart: unless-stopped
    networks:
      - aegisnet

  prometheus:
    image: prom/prometheus:latest
    container_name: aegis_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    networks:
      - aegisnet

  grafana:
    image: grafana/grafana:latest
    container_name: aegis_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - aegisnet

  intelligence-api:
    image: aegis-intelligence:1.0.0
    build:
      context: ./intelligence
      dockerfile: Dockerfile
    environment:
      AEGIS_MANAGER_URL: http://manager:8001
      AEGIS_DB_PATH: /app/data/aegis.db
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      AEGIS_RAG_MODE: ${AEGIS_RAG_MODE:-off}
      AEGIS_VECTOR_DB_PASSWORD: ${AEGIS_VECTOR_DB_PASSWORD:-aegis_local_dev}
      AEGIS_VECTOR_DATABASE_URL: ${AEGIS_VECTOR_DATABASE_URL:-}
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - telemetry_data:/app/data
    depends_on:
      manager:
        condition: service_healthy
    networks:
      - aegisnet
      - intelligence
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/healthz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  dashboard:
    image: aegis-intelligence:1.0.0
    command:
      - python
      - -m
      - streamlit
      - run
      - dashboard/main.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    environment:
      AEGIS_AI_API_URL: http://intelligence-api:8010
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      intelligence-api:
        condition: service_healthy
    networks:
      - intelligence
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  telemetry_data:
    name: ${AEGIS_TELEMETRY_VOLUME:-aegis_telemetry_data}

  vector_data:

networks:
  aegisnet:
    driver: bridge

  intelligence:
    driver: bridge
